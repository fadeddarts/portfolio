<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive procedural sculpture and material laboratory.">
  <title>Form / Material — Procedural Art Lab</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="./" aria-label="Form Material home">
      <span>FORM</span><i></i><span>MAT.</span>
    </a>
    <p>Procedural object studies<br>WebGL / 2026</p>
    <span class="edition">LAB—01</span>
  </header>

  <main>
    <section class="stage" aria-label="Interactive 3D sculpture viewer">
      <canvas id="scene" aria-label="A rotatable procedural 3D sculpture"></canvas>
      <div class="index" aria-hidden="true"><span id="object-number">01</span><span>/03</span></div>
      <div class="axis axis-x" aria-hidden="true"></div>
      <div class="axis axis-y" aria-hidden="true"></div>
      <p class="drag-note">Drag to orbit · Scroll to zoom</p>

      <div class="material-card" aria-live="polite">
        <p class="eyebrow">Current study</p>
        <h1 id="object-title">Cobalt Knot</h1>
        <p id="object-meta">Torus knot / Cobalt ceramic</p>
      </div>

      <nav class="object-picker" aria-label="Choose sculpture">
        <button class="object-button active" data-object="0" aria-pressed="true">
          <span>01</span><strong>Knot</strong>
        </button>
        <button class="object-button" data-object="1" aria-pressed="false">
          <span>02</span><strong>Fold</strong>
        </button>
        <button class="object-button" data-object="2" aria-pressed="false">
          <span>03</span><strong>Orbit</strong>
        </button>
      </nav>

      <div class="controls" aria-label="Display settings">
        <label class="switch">
          <span>Wireframe</span>
          <input id="wireframe" type="checkbox">
          <i aria-hidden="true"></i>
        </label>
        <label class="switch">
          <span>Auto rotate</span>
          <input id="autorotate" type="checkbox" checked>
          <i aria-hidden="true"></i>
        </label>
      </div>
    </section>
  </main>

  <footer>
    <span>Three.js material laboratory</span>
    <span>Everything generated in-browser</span>
  </footer>
  <script type="module" src="./script.js"></script>
</body>
</html>
