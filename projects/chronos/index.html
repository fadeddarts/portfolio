<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f0eb">
  <meta name="description" content="Chronos — a precise spatial instrument for local time.">
  <title>Chronos — Spatial Timepiece</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <canvas id="clockCanvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <a class="wordmark" href="./" aria-label="Chronos home">
      CHRONOS<span>®</span>
    </a>
    <div class="header-meta">
      <p>SPATIAL TIME<br>INSTRUMENT</p>
      <p id="zoneLabel">LOCAL<br>TIME</p>
    </div>
  </header>

  <main>
    <section class="time-readout" aria-label="Current local time">
      <p class="label">CURRENT LOCAL TIME</p>
      <div class="digits">
        <span id="hours">00</span><i>:</i><span id="minutes">00</span><i>:</i><span id="seconds">00</span>
      </div>
      <div class="date-row">
        <span id="dayName">THURSDAY</span>
        <span id="fullDate">16 / 07 / 2026</span>
        <span id="millis">000</span>
      </div>
    </section>
  </main>

  <div class="mode-panel" role="group" aria-label="Composition mode">
    <span class="panel-label">FIELD</span>
    <button id="orbitMode" class="mode-button active" type="button" aria-pressed="true">Orbit</button>
    <button id="gridMode" class="mode-button" type="button" aria-pressed="false">Grid</button>
  </div>

  <button id="pauseButton" class="pause-button" type="button" aria-pressed="false">
    <span class="pause-icon" aria-hidden="true"></span>
    <span id="pauseLabel">Pause field</span>
  </button>

  <aside class="instruction" aria-label="Interaction hint">
    <span>MOVE</span>
    Pointer alters perspective
  </aside>

  <footer>
    <span>LAT <b id="latValue">00.000</b></span>
    <span>LONG <b id="longValue">00.000</b></span>
    <span>UTC <b id="offsetValue">+00:00</b></span>
    <span class="edition">C—02 / MMXXVI</span>
  </footer>

  <noscript>This experience requires JavaScript to render the spatial timepiece.</noscript>
  <script src="./script.js"></script>
</body>
</html>
