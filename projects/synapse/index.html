<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Synapse — an interactive, audio-reactive neural field.">
  <title>Synapse — Neural Field</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <canvas id="mesh" aria-hidden="true"></canvas>

  <header class="site-header">
    <a class="brand" href="./" aria-label="Synapse home">
      <span class="brand-mark"></span>
      <span>SYNAPSE</span>
    </a>
    <p class="edition">GENERATIVE STUDY<br>NO. 01 / 2026</p>
  </header>

  <main>
    <section class="hero" aria-labelledby="title">
      <div class="index" aria-hidden="true">S—01</div>
      <div class="title-wrap">
        <p class="eyebrow">A MACHINE FOR LISTENING</p>
        <h1 id="title">NEURAL<br><span>FIELD</span></h1>
      </div>
      <p class="statement">
        A responsive system of synthetic neurons. Sound becomes voltage;
        gesture becomes gravity.
      </p>
    </section>
  </main>

  <div class="controls" role="group" aria-label="Neural field controls">
    <button id="audioToggle" class="primary-control" type="button" aria-pressed="false">
      <span class="control-icon" aria-hidden="true"></span>
      <span id="audioLabel">Start signal</span>
    </button>
    <button id="forceToggle" class="text-control" type="button" aria-pressed="false">
      Force: Attract
    </button>
  </div>

  <aside class="legend" aria-label="Interaction instructions">
    <div><span class="legend-dot"></span> Move to distort field</div>
    <div><span class="legend-line"></span> Click to emit pulse</div>
  </aside>

  <div class="status" aria-live="polite">
    <span id="statusText">Autonomous / silent</span>
    <span id="nodeCount">00 nodes</span>
  </div>

  <noscript>This experience requires JavaScript to render the neural field.</noscript>
  <script src="./script.js"></script>
</body>
</html>
